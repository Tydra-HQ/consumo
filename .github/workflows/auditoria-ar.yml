# Compara todos los meses la base oficial argentina de estaciones con la de la app y deja un informe.
# NO cambia la base de la app: el informe es para que Leonardo decida qué corregir.
name: Auditoría estaciones Argentina
# El servidor de datos.energia.gob.ar no responde a conexiones desde fuera de Argentina (GitHub está en EE. UU.),
# así que por ahora solo se corre a mano. La auditoría se hace con: python tools/audit_ar.py --file precios.csv
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Auditar
        run: python tools/audit_ar.py
      - name: Guardar informe
        if: always()
        run: |
          git config user.name "robot-estaciones"
          git config user.email "actions@users.noreply.github.com"
          git add reportes/ || true
          git diff --cached --quiet || git commit -m "Auditoría Argentina: $(date -u +%F)"
          git push
