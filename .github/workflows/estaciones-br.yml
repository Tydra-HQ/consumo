# Estaciones de Brasil (ANP, API Revendedores): todos los lunes.
name: Estaciones de Brasil
on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:
  push:
    paths: [tools/update_br.py, .github/workflows/estaciones-br.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Descargar datos de Brasil
        run: python tools/update_br.py estaciones-BR.json
      - name: Guardar
        if: always()
        run: |
          git config user.name "robot-estaciones"
          git config user.email "actions@users.noreply.github.com"
          git add -A estaciones-BR*.json reportes/br-muestra.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Estaciones de Brasil: $(date -u +%F)"
          git pull --rebase && git push
