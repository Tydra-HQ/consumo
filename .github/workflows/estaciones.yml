# Actualiza todas las mañanas las estaciones y precios de España (datos oficiales del Ministerio).
# Argentina NO se actualiza sola: su archivo lo prepara Leonardo a mano.
name: Actualizar estaciones de España
on:
  schedule:
    - cron: "17 7 * * *"   # todos los días, 07:17 UTC (04:17 en Buenos Aires)
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions
  push:
    paths: [tools/update_es.py, .github/workflows/estaciones.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Descargar datos de España
        run: |
          pip install --quiet cryptography certifi
          python tools/update_es.py estaciones-ES.json
      - name: Guardar si cambió
        run: |
          git config user.name "robot-estaciones"
          git config user.email "actions@users.noreply.github.com"
          git add estaciones-ES.json
          git diff --cached --quiet || git commit -m "Estaciones y precios de España: $(date -u +%F)"
          git push
